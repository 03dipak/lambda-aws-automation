name: Deploy Multiple Lambdas

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Dependencies
        run: |
          python pip install -r requirements.txt -t

      - name: Deploy Lambda1
        run: |
          python scripts/deploy_lambda.py lambda1 lambdas/lambda1 ${{ secrets.ROLE_ARN }} ${{ secrets.AWS_REGION }}

      - name: Deploy Lambda2
        run: |
          python scripts/deploy_lambda.py lambda2 lambdas/lambda2 ${{ secrets.ROLE_ARN }} ${{ secrets.AWS_REGION }}
