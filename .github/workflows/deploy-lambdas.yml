name: Deploy Multiple Lambdas

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      
    strategy:
        matrix:
            lambda: [lambda1, lambda2]

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:   
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
        
      - name: Install Dependencies for ${{ matrix.lambda }}
        working-directory: lambdas/${{ matrix.lambda }}
        run: |
          pip install -r ../../requirements.txt -t .  
        
      - name: Deploy Lambda ${{ matrix.lambda }}
        working-directory: lambdas/${{ matrix.lambda }}
        run: |
          python ../../scripts/deploy_lambda.py ${{ matrix.lambda }} . ${{ secrets.ROLE_ARN }} ${{ secrets.AWS_REGION }}
      